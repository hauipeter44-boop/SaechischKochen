<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kochbuch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Kochbuch</h1>
      <p class="login-sub">Melde dich an, um fortzufahren.</p>
      <input id="loginEmail" type="email" placeholder="E-Mail" autocomplete="username" class="login-input">
      <input id="loginPassword" type="password" placeholder="Passwort" autocomplete="current-password" class="login-input">
      <button id="loginBtn" class="btn-primary">Anmelden</button>
      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <div id="appRoot" hidden>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Zurück">‹</button>
    <h1 id="pageTitle">Kategorien</h1>
    <button id="addBtn" class="icon-btn" aria-label="Hinzufügen">+</button>
    <button id="favoriteBtn" class="icon-btn" hidden aria-label="Favorit">☆</button>
  </header>

  <main id="list" class="list"></main>

  <main id="recipeView" class="recipe-view" hidden>
    <div class="field">
      <input id="recipeTitleInput" type="text" class="title-input" placeholder="Titel" autocomplete="off">
    </div>

    <label class="field-label">Fotos</label>
    <div id="photosList" class="photos-list"></div>
    <input id="photoFileInput" type="file" accept="image/*" style="display:none;">
    <button id="addPhotoBtn" class="btn-add">+ Foto hinzufügen</button>

    <div class="section-header" style="margin-top:20px;">
      <label class="field-label">Zutaten</label>
      <button id="scaleOpenBtn" class="scale-open-btn">Menge anpassen</button>
    </div>
    <div id="ingredientsList" class="ingredients-list"></div>
    <button id="addIngredientBtn" class="btn-add">+ Zutat hinzufügen</button>

    <label class="field-label" style="margin-top:20px;">Zubereitung</label>
    <div id="stepsList" class="steps-list"></div>
    <button id="addStepBtn" class="btn-add">+ Schritt hinzufügen</button>

    <label class="field-label" style="margin-top:20px;">Hinweise &amp; Erfahrungen</label>
    <div id="entriesList" class="entries-list"></div>
    <button id="addEntryBtn" class="btn-add">+ Eintrag hinzufügen</button>

    <label class="field-label" style="margin-top:20px;">Fermentation</label>
    <div id="batchesList" class="entries-list"></div>
    <button id="addBatchBtn" class="btn-add">+ Neuen Batch starten</button>

    <label class="field-label" style="margin-top:20px;">Rohrezept</label>
    <textarea id="recipeRawText" class="raw-textarea" placeholder="Zutaten, Mengen, Zubereitung – so wie du es hast, unformatiert."></textarea>

    <div class="recipe-actions">
      <button id="recipeSaveBtn" class="btn-primary">Speichern</button>
      <button id="recipeDeleteBtn" class="btn-danger">Rezept löschen</button>
    </div>
  </main>

  <main id="batchView" class="recipe-view" hidden>
    <h2 id="batchTitle" style="margin:0 0 4px; font-size:19px; font-weight:600;">Batch</h2>
    <p id="batchMeta" class="entry-date" style="margin:0 0 16px;"></p>

    <div class="modal-actions" style="margin-bottom:20px;">
      <button id="batchFinishBtn" class="btn-secondary">Als abgeschlossen markieren</button>
      <button id="batchDeleteBtn" class="btn-danger">Batch löschen</button>
    </div>

    <label class="field-label">Tagebuch</label>
    <div id="batchEntriesList" class="entries-list"></div>
    <button id="addBatchEntryBtn" class="btn-add">+ Tagebucheintrag hinzufügen</button>
  </main>

  <main id="knowledgeView" class="knowledge-view" hidden>
    <div class="knowledge-filters">
      <select id="knowledgeTypeFilter" class="entry-type-select">
        <option value="">Alle Arten</option>
        <option value="Hinweis">Hinweis</option>
        <option value="Erfahrung">Erfahrung</option>
        <option value="Fehler">Fehler</option>
        <option value="Verbesserung">Verbesserung</option>
        <option value="Variante">Variante</option>
        <option value="Merken">Merken</option>
        <option value="Experiment">Experiment</option>
      </select>
      <input id="knowledgeSearchInput" type="text" class="knowledge-search" placeholder="Suche…">
    </div>
    <button id="exportBtn" class="export-btn">⬇ Alle Daten als Datei sichern</button>
    <div id="knowledgeList" class="knowledge-list"></div>
  </main>

  <main id="searchView" class="search-view" hidden>
    <input id="globalSearchInput" type="text" class="knowledge-search full-width" placeholder="Rezepte, Zutaten, Hinweise durchsuchen…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </main>

  <nav class="tabbar">
    <button id="tabLibrary" class="tab-btn active">Bibliothek</button>
    <button id="tabKnowledge" class="tab-btn">Wissen</button>
    <button id="tabSearch" class="tab-btn">Suche</button>
  </nav>

  <div id="modalOverlay" class="overlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">Neue Kategorie</h2>
      <input id="modalInput" type="text" placeholder="Name" autocomplete="off">
      <div class="modal-actions">
        <button id="modalCancel" class="btn-secondary">Abbrechen</button>
        <button id="modalSave" class="btn-primary">Speichern</button>
      </div>
    </div>
  </div>

  <div id="menuOverlay" class="overlay" hidden>
    <div class="sheet">
      <button id="menuRename" class="sheet-btn">Umbenennen</button>
      <button id="menuUp" class="sheet-btn">Nach oben verschieben</button>
      <button id="menuDown" class="sheet-btn">Nach unten verschieben</button>
      <button id="menuDelete" class="sheet-btn danger">Löschen</button>
      <button id="menuCancel" class="sheet-btn cancel">Abbrechen</button>
    </div>
  </div>

  <div id="addChoiceOverlay" class="overlay" hidden>
    <div class="sheet">
      <button id="addCategoryBtn" class="sheet-btn">Neue Kategorie</button>
      <button id="addRecipeBtn" class="sheet-btn">Neues Rezept</button>
      <button id="addOcrBtn" class="sheet-btn">Rezept aus Foto</button>
      <button id="addCancelBtn" class="sheet-btn cancel">Abbrechen</button>
    </div>
  </div>

  <input id="ocrFileInput" type="file" accept="image/*" style="display:none;">

  <div id="ocrOverlay" class="overlay" hidden>
    <div class="modal" style="text-align:center;">
      <p id="ocrStatus" style="margin:0;">Text wird erkannt…</p>
    </div>
  </div>

  <div id="entryOverlay" class="overlay" hidden>
    <div class="modal">
      <h2>Hinweis / Erfahrung</h2>
      <select id="entryType" class="entry-type-select">
        <option value="Hinweis">Hinweis</option>
        <option value="Erfahrung">Erfahrung</option>
        <option value="Fehler">Fehler</option>
        <option value="Verbesserung">Verbesserung</option>
        <option value="Variante">Variante</option>
        <option value="Merken">Merken</option>
        <option value="Experiment">Experiment</option>
      </select>
      <textarea id="entryText" class="entry-textarea" placeholder="Was ist dir aufgefallen?"></textarea>
      <div class="modal-actions">
        <button id="entryCancel" class="btn-secondary">Abbrechen</button>
        <button id="entrySave" class="btn-primary">Speichern</button>
      </div>
    </div>
  </div>

  <div id="scaleOverlay" class="overlay" hidden>
    <div class="modal scale-modal">
      <h2>Menge anpassen</h2>

      <label class="field-label">Faktor</label>
      <input id="scaleFactorInput" type="text" inputmode="decimal" class="scale-factor-input" value="1" placeholder="z. B. 1.5">

      <label class="field-label" style="margin-top:12px;">oder an einer Zutat ausrichten</label>
      <div class="scale-reference-row">
        <select id="scaleReferenceSelect" class="scale-reference-select"></select>
        <input id="scaleReferenceAmount" type="text" inputmode="decimal" class="scale-reference-input" placeholder="neue Menge">
        <button id="scaleReferenceApply" class="btn-secondary small">Anwenden</button>
      </div>

      <div id="scaleIngredientsList" class="scale-ingredients-list"></div>

      <div class="modal-actions">
        <button id="scaleClose" class="btn-primary">Fertig</button>
      </div>
    </div>
  </div>

  </div>

  <div id="batchEntryOverlay" class="overlay" hidden>
    <div class="modal">
      <h2>Tagebucheintrag</h2>
      <label class="field-label">Temperatur (°C, optional)</label>
      <input id="batchEntryTemp" type="text" inputmode="decimal" class="scale-factor-input" placeholder="z. B. 22">
      <label class="field-label" style="margin-top:12px;">Notiz</label>
      <textarea id="batchEntryNote" class="entry-textarea" placeholder="Was ist dir aufgefallen?"></textarea>
      <div class="modal-actions">
        <button id="batchEntryCancel" class="btn-secondary">Abbrechen</button>
        <button id="batchEntrySave" class="btn-primary">Speichern</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
