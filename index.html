<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kochbuch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Zurück">‹</button>
    <h1 id="pageTitle">Kategorien</h1>
    <button id="addBtn" class="icon-btn" aria-label="Hinzufügen">+</button>
    <button id="favoriteBtn" class="icon-btn" hidden aria-label="Favorit">☆</button>
  </header>

  <main id="list" class="list"></main>

  <main id="recipeView" class="recipe-view" hidden>
    <div class="field">
      <input id="recipeTitleInput" type="text" class="title-input" placeholder="Titel" autocomplete="off">
    </div>
    <label class="field-label" for="recipeRawText">Rohrezept</label>
    <textarea id="recipeRawText" class="raw-textarea" placeholder="Zutaten, Mengen, Zubereitung – so wie du es hast, unformatiert."></textarea>
    <div class="recipe-actions">
      <button id="recipeSaveBtn" class="btn-primary">Speichern</button>
      <button id="recipeDeleteBtn" class="btn-danger">Rezept löschen</button>
    </div>
  </main>

  <div id="modalOverlay" class="overlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">Neue Kategorie</h2>
      <input id="modalInput" type="text" placeholder="Name" autocomplete="off">
      <div class="modal-actions">
        <button id="modalCancel" class="btn-secondary">Abbrechen</button>
        <button id="modalSave" class="btn-primary">Speichern</button>
      </div>
    </div>
  </div>

  <div id="menuOverlay" class="overlay" hidden>
    <div class="sheet">
      <button id="menuRename" class="sheet-btn">Umbenennen</button>
      <button id="menuUp" class="sheet-btn">Nach oben verschieben</button>
      <button id="menuDown" class="sheet-btn">Nach unten verschieben</button>
      <button id="menuDelete" class="sheet-btn danger">Löschen</button>
      <button id="menuCancel" class="sheet-btn cancel">Abbrechen</button>
    </div>
  </div>

  <div id="addChoiceOverlay" class="overlay" hidden>
    <div class="sheet">
      <button id="addCategoryBtn" class="sheet-btn">Neue Kategorie</button>
      <button id="addRecipeBtn" class="sheet-btn">Neues Rezept</button>
      <button id="addCancelBtn" class="sheet-btn cancel">Abbrechen</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
